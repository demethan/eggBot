name: Tests and dependency audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pipenv
      - name: Install locked dependencies and audit tooling
        run: |
          python -m pip install --disable-pip-version-check pipenv pip-audit
          pipenv sync --system
      - name: Run tests
        run: python -m unittest discover -s tests -q
      - name: Audit dependencies
        run: pip-audit --progress-spinner off
